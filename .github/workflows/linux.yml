name: Linux desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow so tag builds attach Linux packages.
  workflow_call:
    inputs:
      artifact:
        description: Artifact name for the built packages
        type: string
        required: false
        default: veirune-linux-x86_64

permissions:
  contents: read

env:
  # linuxdeploy and the AppImage tooling are distributed as AppImages.
  # Extracting them avoids FUSE requirements on CI runners.
  APPIMAGE_EXTRACT_AND_RUN: '1'
  # Never let the bundler strip the frozen CLAP worker.
  NO_STRIP: '1'
  BUNDLE: desktop/src-tauri/target/release/bundle
  RELEASE: desktop/release

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: linux-desktop-x86_64
          save-if: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libssl-dev patchelf \
            dpkg-dev libgirepository1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio
          # linuxdeploy is distributed as an AppImage and needs FUSE 2 when the
          # runner provides it; the extraction fallback below works without it.
          sudo apt-get install -y libfuse2t64 || true
      - name: Restore and verify native CLAP resources
        uses: ./.github/actions/clap-resources
        with:
          arch: x86_64
      - run: npm ci
        working-directory: desktop
      - name: Build Debian package with CLAP ("My Wave")
        working-directory: desktop
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --config src-tauri/tauri.private.conf.json --bundles deb --ci -- --locked
      - name: Build AppImage with CLAP ("My Wave")
        working-directory: desktop
        # --verbose keeps linuxdeploy's diagnostics in the failure message:
        # without it tauri only reports "failed to run linuxdeploy".
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --config src-tauri/tauri.private.conf.json --bundles appimage --verbose --ci -- --locked
      - name: Verify the Debian package ships an executable CLAP worker and weights
        run: |
          deb=$(ls "$BUNDLE"/deb/*.deb)
          dpkg-deb -c "$deb" > clap-listing.txt
          grep -E 'resources/clap/worker-lite/fastcloud-clap/fastcloud-clap$' clap-listing.txt
          grep -E 'resources/clap/model/onnx/(audio|text)_model_quantized.onnx$' clap-listing.txt
          # Debian packaging must not drop the executable bit of the frozen worker.
          grep -E '^-rwx.*resources/clap/worker-lite/fastcloud-clap/fastcloud-clap$' clap-listing.txt
      - name: Verify the AppImage is a complete bundle
        run: |
          appimage=$(ls "$BUNDLE"/appimage/*.AppImage)
          chmod +x "$appimage"
          test "$(head -c 4 "$appimage" | od -An -tx1 | tr -d ' \n')" = "7f454c46"
          # The AppImage embeds the WebView payload plus the CLAP worker and
          # model weights, so a tiny file means the bundler silently dropped them.
          test "$(stat -c %s "$appimage")" -gt 20000000
      - name: Stage release-named Linux installers
        run: python tools/stage_linux_release.py "$BUNDLE"/deb/*.deb "$BUNDLE"/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'veirune-linux-x86_64' }}
          path: ${{ env.RELEASE }}/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'veirune-linux-x86_64' }}-appimage
          path: ${{ env.RELEASE }}/*.AppImage
          if-no-files-found: error
          retention-days: 7
