name: Linux desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow so tag builds attach Linux packages.
  workflow_call:
    inputs:
      artifact:
        description: Artifact name for the built packages
        type: string
        required: false
        default: veirune-linux-x86_64
      destination:
        description: Directory the artifacts are uploaded from
        type: string
        required: false
        default: desktop/src-tauri/target/release/bundle

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      # linuxdeploy is distributed as an AppImage. Extracting it avoids FUSE
      # requirements on CI runners; never strip the frozen CLAP worker.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
      BUNDLE: ${{ inputs.destination || 'desktop/src-tauri/target/release/bundle' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: linux-desktop-x86_64
          save-if: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev patchelf
          # FUSE 2 lets linuxdeploy run natively where the runner provides it.
          sudo apt-get install -y libfuse2t64 || true
      - name: Restore and verify native CLAP resources
        uses: ./.github/actions/clap-resources
        with:
          arch: x86_64
      - run: npm ci
        working-directory: desktop
      - name: Build Debian package with CLAP ("My Wave")
        working-directory: desktop
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --config src-tauri/tauri.private.conf.json --bundles deb --ci -- --locked
      - name: Build AppImage with CLAP ("My Wave")
        working-directory: desktop
        run: npm run tauri -- build --config src-tauri/tauri.linux.conf.json --config src-tauri/tauri.private.conf.json --bundles appimage --ci -- --locked
      - name: Verify the Debian package ships an executable CLAP worker and weights
        run: |
          deb=$(ls "$BUNDLE"/deb/*.deb)
          dpkg-deb -c "$deb" > clap-listing.txt
          grep -E 'resources/clap/worker-lite/fastcloud-clap/fastcloud-clap$' clap-listing.txt
          grep -E 'resources/clap/model/onnx/(audio|text)_model_quantized.onnx$' clap-listing.txt
          # Debian packaging must not drop the executable bit of the frozen worker.
          grep -E '^-rwx.*resources/clap/worker-lite/fastcloud-clap/fastcloud-clap$' clap-listing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'veirune-linux-x86_64' }}
          path: ${{ env.BUNDLE }}/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'veirune-linux-x86_64' }}-appimage
          path: ${{ env.BUNDLE }}/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
